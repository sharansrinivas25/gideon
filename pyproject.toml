[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gideon"
version = "0.1.0"
description = "A GPT-style transformer and inference engine built from scratch in PyTorch"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sharan Srinivas Arvind" }]
keywords = ["transformer", "gpt", "kv-cache", "quantization", "inference"]
dependencies = ["torch>=2.0", "numpy"]

[project.optional-dependencies]
# ruff is pinned: an unpinned linter means CI breaks whenever a new release
# changes the default rule set, with no change on our side.
dev = ["pytest>=7", "matplotlib>=3.7", "ruff>=0.15.11,<0.16"]

[project.scripts]
gideon-train = "gideon.train:main"
gideon-generate = "gideon.generate:main"
gideon-bench = "gideon.benchmark:main"

[tool.setuptools.packages.find]
include = ["gideon*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
